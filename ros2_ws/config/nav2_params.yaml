# TAI Robot One - ROS 2 Jazzy simulation-first Nav2 configuration.
# Planar safety footprint includes the complete 455 mm fork projection.

amcl:
  ros__parameters:
    use_sim_time: true
    # The fused wheel/IMU odometry stays nearly fixed during an in-place
    # pivot. Large motion noise let AMCL move map->odom by 10-20 cm there,
    # repeatedly pulling the robot out of the 4 cm goal tolerance.
    alpha1: 0.03
    alpha2: 0.03
    alpha3: 0.03
    alpha4: 0.03
    alpha5: 0.03
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.10
    update_min_a: 0.10
    transform_tolerance: 0.5
    tf_broadcast: true
    # Simulation-only convenience: Gazebo and SLAM mapping both start the
    # robot at map pose (0, 0, 0). Real hardware must use a measured/selected
    # initial pose (or a separate production parameter file).
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    # robot_localization fuses raw /base_controller/odom (and simulated IMU)
    # into the same public /odom contract used by the real-hardware launch.
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 100
    # A 20 ms result wait expired before the 20 Hz BackUp loop canceled.
    # Complete cancellation before the next recovery action starts.
    default_cancel_timeout: 200
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # Custom BT node remembers the last commanded angular direction and
    # generates a recovery turn with the opposite sign.
    plugin_lib_names: [tai_compute_opposite_spin_bt_node, tai_path_footprint_clear_bt_node]
    # Keep a valid State Lattice path stable. Replan only when the goal changes
    # or costmap validation reports that the current path is obstructed.
    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: true
    # Jazzy's Nav2 command chain remains Twist; cmd_vel_stamper converts only
    # the final, safety-filtered command for ros2_control's TwistStamped input.
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      # Count yaw changes as progress. A valid in-place turn must not be
      # aborted merely because the XY position stays unchanged.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      # Near obstacles FootprintApproach may limit a safe turn to ~0.03 rad/s.
      # Treat 0.04 rad of yaw change as real progress at that reduced speed.
      required_movement_angle: 0.04
      # Declare a real blockage only when neither XY nor yaw is changing.
      movement_time_allowance: 5.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Re-check XY on every action/tick. A canceled path must not leave XY
      # latched and report success at a different physical location.
      stateful: false
      # Accept the requested 5 cm position error at arrival.
      xy_goal_tolerance: 0.05
      # Accept only a 5 degree final heading error. The controller's stationary
      # turn guard prevents an unreachable goal from spinning indefinitely.
      yaw_goal_tolerance: 0.0872664626
    FollowPath:
      plugin: tai_robot_one::SafeRotationRPP
      # Keep pruning near the traveled prefix. A grid path can pass near its
      # start later; the RPP default (half the 5 m local map) then jumps to
      # that later section and repeatedly spins toward changing tangents.
      max_robot_pose_search_dist: 0.30
      # Modest cruise increase; retain the downstream acceleration limits.
      desired_linear_vel: 0.28
      lookahead_dist: 0.60
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.40
      lookahead_time: 1.5
      # Slow final heading corrections on the four-wheel skid-steer base.
      rotate_to_heading_angular_vel: 0.35
      transform_tolerance: 0.20
      use_velocity_scaled_lookahead_dist: true
      # The loaded drivetrain slips/stalls when Nav2 tapers below its reliable
      # floor near a goal. Keep active translation at the measured floor.
      min_approach_linear_velocity: 0.10
      # Arrival braking begins in the last 30 cm. Obstacle/curvature speed
      # regulation remains independent of this distance.
      approach_velocity_scaling_dist: 0.30
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # Must not exceed the 0.88 m costmap inflation radius. Keep this factor
      # identical to InflationLayer so RPP can convert costs back to distance.
      cost_scaling_dist: 0.35
      cost_scaling_gain: 0.65
      inflation_cost_scaling_factor: 4.0
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.08
      use_fixed_curvature_lookahead: false
      allow_reversing: false
      use_rotate_to_heading: true
      # Prefer an in-place alignment over a long initial arc.
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 0.6

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 8.0
      publish_frequency: 8.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      # 5 x 5 m at 2.5 cm: 200x200 cells instead of 250x250. The
      # 4.5 cm total planning margin still exceeds one 2.5 cm cell.
      resolution: 0.025
      # Chassis rear=-0.303 m, fork tip=+0.758 m, wheel outer y=+/-0.232 m.
      # A 20 mm planning margin is included on every side.
      footprint: "[[0.78, 0.10], [0.78, -0.10], [0.38, -0.25], [-0.33, -0.25], [-0.33, 0.25], [0.38, 0.25]]"
      # The polygon already includes a 20 mm planning margin. A further
      # 25 mm clears the measured raster-only front-fork contact during
      # retreat, while retaining 45 mm total physical-body clearance.
      footprint_padding: 0.025
      plugins: [lidar_obstacle_layer, camera_obstacle_layer, fork_safety_layer, rear_safety_layer, inflation_layer]
      rear_safety_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: false
        observation_sources: rear_scan
        rear_scan:
          topic: /rear_scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.03
          obstacle_max_range: 1.8
          raytrace_min_range: 0.03
          raytrace_max_range: 2.0
          max_obstacle_height: 2.0
          inf_is_valid: true
      lidar_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Remove self-returns and stale points under the current robot body.
        # The independent Collision Monitor Stop polygon remains fail-safe.
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          # The 5 m rolling window cannot use returns farther than its
          # diagonal half-span (~3.54 m). Ignore distant speckle locally.
          obstacle_max_range: 3.0
          raytrace_min_range: 0.15
          raytrace_max_range: 3.5
          max_obstacle_height: 2.0
          inf_is_valid: true
      camera_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        # Keep camera obstacles in a separate layer: a lidar clearing ray must
        # not erase a low obstacle detected by the RGB-D camera.
        observation_sources: camera_obstacle_scan
        camera_obstacle_scan:
          topic: /camera/obstacle_scan
          data_type: LaserScan
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.60
          obstacle_max_range: 6.00
          raytrace_min_range: 0.60
          raytrace_max_range: 6.00
          # A no-return camera ray clears only this camera layer, so a moved
          # low obstacle does not remain marked after the next depth scan.
          inf_is_valid: true
      fork_safety_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Preserve a near-field rack return even after it enters the planning
        # footprint. This layer is independent from the main lidar.
        footprint_clearing_enabled: false
        observation_sources: fork_scan
        fork_scan:
          topic: /fork_scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.03
          # Keep this below raytrace_max_range. Infinite / no-return rays are
          # projected to the raytrace limit and must only clear free space,
          # never create a false semicircular obstacle at exactly 2 m.
          obstacle_max_range: 1.80
          raytrace_min_range: 0.03
          raytrace_max_range: 2.0
          max_obstacle_height: 2.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        # Soft buffer reduced modestly; still exceeds circumscribed radius.
        # Do not shrink the physical footprint or Collision Monitor stop zone.
        inflation_radius: 0.88
      # Late RViz subscribers need periodic full maps; incremental-only mode
      # left the display at "No map received" after reopening RViz.
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.78, 0.10], [0.78, -0.10], [0.38, -0.25], [-0.33, -0.25], [-0.33, 0.25], [0.38, 0.25]]"
      # Match the local footprint; inflation costs provide soft clearance.
      footprint_padding: 0.03
      plugins: [static_layer, lidar_obstacle_layer, camera_obstacle_layer, fork_safety_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      lidar_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          obstacle_max_range: 6.0
          raytrace_min_range: 0.15
          raytrace_max_range: 8.0
          max_obstacle_height: 2.0
          inf_is_valid: true
      camera_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        # Preserve low camera detections from clearing rays produced by the
        # independently mounted lidar.
        observation_sources: camera_obstacle_scan
        camera_obstacle_scan:
          topic: /camera/obstacle_scan
          data_type: LaserScan
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.60
          obstacle_max_range: 6.00
          raytrace_min_range: 0.60
          raytrace_max_range: 6.00
          # Clear old camera marks without changing the independent static map.
          inf_is_valid: true
      fork_safety_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: false
        observation_sources: fork_scan
        fork_scan:
          topic: /fork_scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.03
          # Do not mark the 2 m endpoint of infinite / no-return rays.
          obstacle_max_range: 1.80
          raytrace_min_range: 0.03
          raytrace_max_range: 2.0
          max_obstacle_height: 2.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        # Match the local layer and satisfy Smac's SE2 collision checker.
        inflation_radius: 0.88
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/tai/ros2_ws/maps/tai_warehouse.yaml

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    # Compare body-checked XY, arc and lattice routes by length before motion.
    # Plugin order is search order, not a preference for arcs or stationary turns.
    planner_plugins: [GridShortest, GridBased, SE2Arc, SE2Fallback]
    GridShortest:
      # Low cost bias offers the shortest clear route through open gaps.
      # The body validator checks every pose; GridBased remains a wider option.
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.05
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      cost_travel_multiplier: 1.0
      cache_obstacle_heuristic: false
      smooth_path: false
      debug_visualizations: false
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.05
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      cost_travel_multiplier: 4.0
      cache_obstacle_heuristic: false
      smooth_path: false
      debug_visualizations: false
    SE2Arc:
      # Offer continuous forward arcs to the length-first route comparison.
      plugin: nav2_smac_planner::SmacPlannerHybrid
      tolerance: 0.05
      allow_unknown: false
      downsample_costmap: false
      max_iterations: 250000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      minimum_turning_radius: 0.60
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.5
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      change_penalty: 0.0
      non_straight_penalty: 1.10
      cost_penalty: 2.0
      retrospective_penalty: 0.0
      lookup_table_size: 7.0
      cache_obstacle_heuristic: false
      smooth_path: false
      debug_visualizations: false
    SE2Fallback:
      # Include safe stationary turns so short routes can compete with arcs.
      # The complete padded footprint is checked before this route can execute.
      plugin: nav2_smac_planner::SmacPlannerLattice
      tolerance: 0.05
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.5
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 4.0
      change_penalty: 0.0
      # Prefer short straight primitives and safe in-place alignment over a
      # long continuous arc. Collision clearance still retains full weight.
      non_straight_penalty: 1.35
      # Preserve clearance around obstacles. Route shortening must not trade
      # away this margin because the real/simulated rack geometry and sensing
      # have finite error.
      cost_penalty: 2.0
      rotation_penalty: 1.10
      retrospective_penalty: 0.0
      lattice_filepath: /opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json
      lookup_table_size: 7.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: false
      debug_visualizations: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    # A 10 Hz stop decision plus the velocity-smoother ramp produced roughly
    # 3--4 degrees of overshoot on the loaded base. Check the Spin target at
    # 20 Hz so the stop request is issued closer to the requested heading.
    cycle_frequency: 20.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
      acceleration_limit: 0.4
      deceleration_limit: -0.5
      minimum_speed: 0.08
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
      acceleration_limit: 0.4
      deceleration_limit: -0.5
      minimum_speed: 0.05
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    # Recovery turns are deliberately slow near warehouse obstacles. The
    # velocity smoother and Collision Monitor remain downstream safety layers.
    max_rotational_vel: 0.35
    # Requested lower turn floor; verify breakaway on the loaded chassis.
    min_rotational_vel: 0.22
    rotational_acc_lim: 0.6

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 10
    stop_on_failure: true
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 500

route_server:
  ros__parameters:
    use_sim_time: true
    boundary_radius_to_achieve_node: 0.50
    radius_to_achieve_node: 1.0
    smooth_corners: true
    operations: [AdjustSpeedLimit, ReroutingService, CollisionMonitor]
    ReroutingService:
      plugin: nav2_route::ReroutingService
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      plugin: nav2_route::CollisionMonitor
      max_collision_dist: 2.0
    edge_cost_functions: [DistanceScorer, CostmapScorer]
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    CostmapScorer:
      plugin: nav2_route::CostmapScorer

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    # Preserve commanded curvature when either axis reaches its limit.
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 0.4]
    # Reverse recovery is protected by the required rear low scanner.
    min_velocity: [-0.10, 0.0, -0.4]
    max_accel: [0.5, 0.0, 0.6]
    # Match the real diff-drive controller's angular deceleration limit. At
    # -0.8 rad/s^2 a 0.25 rad/s minimum turn travels about 2.2 degrees during
    # the smoothing ramp alone; -1.5 cuts that contribution roughly in half.
    max_decel: [-0.7, 0.0, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    enabled: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    # Only collision-checked commands may reach the real base. Docking keeps
    # its standard /cmd_vel publisher isolated from this dedicated output.
    cmd_vel_out_topic: cmd_vel_safe
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    # Jazzy exposes one timeout shared by every observation source. Gazebo's
    # 320x240 RGB-D stream can pause for about 1.7 s under WSL while its target
    # update rate remains 10 Hz, so allow that simulation scheduling jitter.
    # Use a shorter independently validated timeout on real hardware.
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [VelocityStop, FootprintApproach]
    VelocityStop:
      type: velocity_polygon
      action_type: stop
      min_points: 1
      visualize: true
      polygon_pub_topic: /collision_monitor/footprint_stop
      # Translation uses a forward-extended stop envelope. Rotation/rest uses
      # the body envelope, with the swept padded footprint checked separately
      # by FootprintApproach and the controller / Spin collision checker.
      velocity_polygons: [translation_forward, translation_reverse, rotation_and_rest]
      translation_reverse:
        points: "[[0.82, 0.14], [0.82, -0.14], [0.42, -0.29], [-0.50, -0.35], [-0.50, 0.35], [0.42, 0.29]]"
        linear_min: -0.08
        linear_max: -0.001
        theta_min: -0.4
        theta_max: 0.4
      holonomic: false
      # Keep the padded rear body protected, but reserve the larger 10 cm
      # stopping margin ahead of the moving body. A rear-side point outside
      # the padded footprint must not block motion away from that point.
      translation_forward:
        points: "[[0.88, 0.20], [0.88, -0.20], [0.48, -0.35], [-0.37, -0.29], [-0.37, 0.29], [0.48, 0.35]]"
        linear_min: 0.02
        linear_max: 0.5
        theta_min: -0.4
        theta_max: 0.4
      # Unmatched velocities retain the previous polygon in Nav2. Cover pure
      # rotation explicitly so the forward stopping envelope cannot latch.
      # Includes the full physical fork/body plus the existing planning margin;
      # FootprintApproach checks the padded footprint swept during rotation.
      rotation_and_rest:
        points: "[[0.78, 0.10], [0.78, -0.10], [0.38, -0.25], [-0.33, -0.25], [-0.33, 0.25], [0.38, 0.25]]"
        linear_min: -0.02
        linear_max: 0.02
        theta_min: -0.4
        theta_max: 0.4
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.05
      # Reduced from four to two so a 30 mm rack post at ~1 m is retained when
      # it spans two adjacent one-degree rays. Raise only after verified noise
      # false-stops; use one only after a separate sensor-noise safety review.
      min_points: 2
      visualize: true
      enabled: true
    # Collision Monitor bypasses the costmaps. The reduced camera scan adds
    # low pallet/load geometry below the physical lidar plane; it is not
    # a safety guarantee for an empty ~35 mm pallet in the camera's near field.
    observation_sources: [scan, camera_obstacle_scan, fork_scan, rear_scan]
    rear_scan:
      type: scan
      topic: /rear_scan
      enabled: true
    scan:
      type: scan
      topic: /scan
      enabled: true
    camera_obstacle_scan:
      type: scan
      topic: /camera/obstacle_scan
      enabled: true
    fork_scan:
      type: scan
      topic: /fork_scan
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 30.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10
    max_retries: 3
    base_frame: base_footprint
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: [simple_charging_dock]
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.70
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.2
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
